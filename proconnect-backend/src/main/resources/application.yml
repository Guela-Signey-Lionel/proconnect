spring:
  application:
    name: proconnect

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proconnect-db}
    username: ${DATABASE_USERNAME:proconnect}
    password: ${DATABASE_PASSWORD:proconnect}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:1025}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # UI servie directement sur /api/swagger-ui/index.html (URL demandée)
    path: /api/swagger-ui/index.html
    url: /v3/api-docs

proconnect:
  # Aucun compte d'administration préconfiguré : le PREMIER admin est créé via
  # POST /api/v1/admin/bootstrap/ (ouvert tant qu'aucun admin n'existe), les
  # suivants sont promus depuis le back-office par un ADMIN connecté.
  admin-bootstrap:
    enabled: false

  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-value-in-production}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:proconnect}
    # URL publique des fichiers : doit être joignable depuis le navigateur du client
    # (les autres machines du LAN utilisent http://192.168.48.35:9000).
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://192.168.48.35:9000}

  uploads:
    max-image-mb: ${MAX_IMAGE_SIZE_MB:5}
    max-document-mb: ${MAX_DOCUMENT_SIZE_MB:20}
    max-video-mb: ${MAX_VIDEO_SIZE_MB:100}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.48.35:3000}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    root: INFO
    com.entreprise.proconnect: DEBUG
